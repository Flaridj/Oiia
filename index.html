<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>Iframe obfusquée</title>
  <style>html,body{height:100%;margin:0}</style>
</head>
<body>
<script>
(function(){
    // Contenu complet à injecter (iframe + protection)
    var code = `
        <iframe id="frame" src="https://lost-loot-journey.lovable.app/?utm_source=lovable-editor" 
        sandbox="allow-scripts allow-forms allow-same-origin" 
        style="width:100%;height:100vh;border:0;display:block"></iframe>
        <script>
        window.addEventListener('contextmenu',function(e){e.preventDefault();});
        window.addEventListener('keydown',function(e){
            if(e.key==='F12'){e.preventDefault();e.stopPropagation();}
            if(e.ctrlKey && e.shiftKey && (e.key==='I'||e.key==='J'||e.key==='C')){e.preventDefault();e.stopPropagation();}
            if(e.ctrlKey && (e.key==='u'||e.key==='U')){e.preventDefault();e.stopPropagation();}
            if(e.metaKey && e.altKey && (e.key==='I'||e.key==='i')){e.preventDefault();e.stopPropagation();}
        },true);
        var devtoolsOpen=false;
        var threshold=160;
        function detectDevTools(){
            var wDiff=window.outerWidth-window.innerWidth;
            var hDiff=window.outerHeight-window.innerHeight;
            if(wDiff>threshold||hDiff>threshold){if(!devtoolsOpen){devtoolsOpen=true;document.getElementById('frame').style.display='none';}}
            else{if(devtoolsOpen){devtoolsOpen=false;document.getElementById('frame').style.display='block';}}
        }
        setInterval(detectDevTools,1000);
        <\/script>
    `;

    // Encodage en base64
    var encoded = btoa(unescape(encodeURIComponent(code)));

    // Décodage et insertion dans le body
    document.write(decodeURIComponent(escape(atob(encoded))));
})();
</script>
</body>
</html>
